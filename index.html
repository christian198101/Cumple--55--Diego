<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Llegaron mis 55... ¡y hay que festejar!
</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Montserrat',sans-serif;
color:white;
overflow-x:hidden;

background:
linear-gradient(
rgba(20,10,10,.65),
rgba(20,10,10,.85)
),
url('fondo55.jpg');

background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;
}

.hero{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.card{
width:100%;
max-width:900px;

background:rgba(0,0,0,.55);
backdrop-filter:blur(12px);

padding:60px 40px;

border-radius:30px;

text-align:center;

border:2px solid rgba(212,175,55,.40);
}
.decorative-line{
width:120px;
height:3px;
background:#d4af37;
margin:auto;
margin-bottom:30px;
}

h1{
font-family:'Playfair Display',serif;
font-size:4rem;
color:#ffd86b;
margin-bottom:25px;
}

.subtitle{
font-size:1.3rem;
line-height:1.8;
}

.quote{
margin-top:30px;
font-size:1.5rem;
font-style:italic;
color:#ffd86b;
}

.buttons{
margin-top:40px;
}

.button{
display:inline-block;
margin:10px;
padding:16px 36px;
background:#d4af37;
color:#1b1207;
border:none;
border-radius:50px;
cursor:pointer;
font-weight:700;
transition:.3s;
}

.button:hover{
background:#ffd86b;
transform:translateY(-3px);
}
#cuentaRegresiva,
#regaloBox{
margin-top:25px;
}

#btnMusica{
position:fixed;
bottom:25px;
right:25px;

width:80px;
height:80px;

border:none;
border-radius:50%;

cursor:pointer;

font-size:32px;

z-index:99999;

background:
linear-gradient(
135deg,
#d4af37,
#ffd86b
);

box-shadow:
0 0 25px rgba(255,216,107,.5);
}

#btnMusica.reproduciendo{
animation:girar 8s linear infinite;
}

@keyframes girar{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

@media(max-width:768px){

h1{
font-size:2.2rem;
}

.subtitle{
font-size:1rem;
}

.button{
width:100%;
max-width:320px;
}

}

</style>
</head>

<body>
<section class="hero">

<div class="card">

<div class="decorative-line"></div>

<h1>

Llegaron mis 55...
<br>
¡y hay que festejar!

</h1>

<p class="subtitle">

Una noche para brindar
por los buenos momentos,
la amistad,
la buena música
y la alegría de vivir.

</p>

<p class="quote">

"Porque los mejores momentos
de la vida no se cuentan...
se celebran."

</p>

<div class="buttons">

<button class="button"
onclick="window.open('https://wa.me/34698987395?text=Hola,%20confirmo%20mi%20asistencia','_blank')">

✅ Confirmar asistencia

</button>

<button class="button"
onclick="mostrarCuentaRegresiva()">

⏳ ¿Cuándo es?

</button>

<button class="button"
onclick="window.open('https://www.google.com/maps/search/?api=1&query=Antonio+Machin+12+1+Sevilla','_blank')">

📍 ¿Dónde es?

</button>

<button class="button"
onclick="mostrarRegalo()">

🎁 Regístrate y llévate un presente

</button>

</div>

<div id="cuentaRegresiva"></div>

<div id="regaloBox"></div>

<div id="popup55"></div>

</div>

</section>
<audio id="musicaFondo" loop>

<source
src="musica.mp3"
type="audio/mpeg">

</audio>

<button
id="btnMusica"
onclick="toggleMusica()">

🎵

</button>

<script>

let temporizador55;

function mostrarCuentaRegresiva(){

const caja =
document.getElementById(
"cuentaRegresiva"
);

caja.style.display="block";

const fechaEvento =
new Date(
"2026-11-28T20:00:00"
).getTime();

clearInterval(
temporizador55
);

temporizador55 =
setInterval(function(){
const ahora =
new Date().getTime();

const diferencia =
fechaEvento-ahora;

const dias =
Math.floor(diferencia/(1000*60*60*24));

const horas =
Math.floor((diferencia%(1000*60*60*24))/(1000*60*60));

const minutos =
Math.floor((diferencia%(1000*60*60))/(1000*60));

const segundos =
Math.floor((diferencia%(1000*60))/1000);

caja.innerHTML=`

<h2 style="color:#ffd86b;">
📅 Sábado 28 de noviembre de 2026
</h2>

<h3>🕗 20:00 hs</h3>

<div style="
font-size:2rem;
font-weight:bold;
margin-top:20px;
">

${dias}d ${horas}h ${minutos}m ${segundos}s

</div>

<br>

<button class="button"
onclick="cerrarFecha()">

❌ Cerrar

</button>
`;

},1000);

}

function cerrarFecha(){

clearInterval(temporizador55);

document.getElementById(
"cuentaRegresiva"
).innerHTML="";

document.getElementById(
"cuentaRegresiva"
).style.display="none";

}

function mostrarRegalo(){

document.getElementById(
"regaloBox"
).innerHTML=`

<div style="
background:rgba(212,175,55,.15);
padding:25px;
border-radius:20px;
margin-top:20px;
">

<h2 style="color:#ffd86b;">
🎁 Hay un regalo para ti
</h2>

<p>
Indícame tu talla para prepararlo.
</p>

<br>

<button class="button"
onclick="window.open('https://wa.me/34698987395?text=Mi%20talla%20es...','_blank')">

👕 Indicar mi talla

</button>

<br><br>

<button class="button"
style="background:#666;color:white;"
onclick="cerrarRegalo()">

❌ Cerrar

</button>

</div>

`;

}

function cerrarRegalo(){

document.getElementById(
"regaloBox"
).innerHTML="";

}

function toggleMusica(){

const audio =
document.getElementById(
"musicaFondo"
);

const boton =
document.getElementById(
"btnMusica"
);

if(audio.paused){

audio.play();

boton.innerHTML="🔊";

boton.classList.add(
"reproduciendo"
);

}else{

audio.pause();

boton.innerHTML="🎵";

boton.classList.remove(
"reproduciendo"
);

}

}

function mostrarPopup55(){

document.getElementById("popup55").innerHTML=`

<div style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.88);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
z-index:999999;
">

<div style="
max-width:700px;
width:100%;
background:#111;
padding:20px;
border-radius:25px;
text-align:center;
border:2px solid #d4af37;
">

<h2 style="
color:#ffd86b;
margin-bottom:20px;
">

🎉 ¡A festejar mis 55 chavales!

</h2>

<img
src="foto55.jpg"
style="
width:100%;
border-radius:20px;
margin-bottom:20px;
">

<button
class="button"
onclick="cerrarPopup55()">

❌ Cerrar

</button>

</div>

</div>

`;

}

function cerrarPopup55(){

document.getElementById(
"popup55"
).innerHTML="";

}

window.addEventListener(
"load",
function(){

setTimeout(function(){

mostrarPopup55();

},1000);

});

</script>

</body>
</html>
